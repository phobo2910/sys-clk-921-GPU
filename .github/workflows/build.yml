name: Build sys-clk
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sysmodule
        run: |
          cd sysmodule
          make
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sys-clk-build
          path: sysmodule/out/
